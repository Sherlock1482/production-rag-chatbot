apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta-backend
  namespace: ta-rag
  labels:
    app: ta-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ta-backend
  template:
    metadata:
      labels:
        app: ta-backend
    spec:
      containers:
        - name: backend
          image: ta-rag-backend:latest
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: QDRANT_URL
              value: "http://qdrant-service:6333"
            - name: GOOGLE_CREDENTIALS_FILE
              value: "/app/credentials.json"
            - name: GOOGLE_TOKEN_FILE
              value: "/app/token.json"
          envFrom:
            - configMapRef:
                 name: ta-rag-config
            - secretRef:
                name: rag-env-secret
          volumeMounts:
            - name: google-oauth-vol
              mountPath: /app/credentials.json
              subPath: credentials.json
              readOnly: true
            - name: google-oauth-vol
              mountPath: /app/token.json
              subPath: token.json
            - name: code-overrides
              mountPath: /app/utils/datetime_extractor.py
              subPath: datetime_extractor.py
            - name: code-overrides
              mountPath: /app/utils/datetime_normalizer.py
              subPath: datetime_normalizer.py
            - name: code-overrides
              mountPath: /app/utils/scheduling_request.py
              subPath: scheduling_request.py
            - name: code-overrides
              mountPath: /app/utils/candidate_resolver.py
              subPath: candidate_resolver.py
            - name: code-overrides
              mountPath: /app/utils/context_manager.py
              subPath: context_manager.py
            - name: code-overrides
              mountPath: /app/utils/schedule_details.py
              subPath: schedule_details.py
            - name: code-overrides
              mountPath: /app/utils/intent_detector.py
              subPath: intent_detector.py
            - name: code-overrides
              mountPath: /app/utils/jd_fit_analyzer.py
              subPath: jd_fit_analyzer.py
            - name: code-overrides
              mountPath: /app/google_calendar.py
              subPath: google_calendar.py
            - name: code-overrides
              mountPath: /app/utils/parser.py
              subPath: parser.py
            - name: code-overrides
              mountPath: /app/utils/indexer.py
              subPath: indexer.py
            - name: code-overrides
              mountPath: /app/main.py
              subPath: main.py
          startupProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
      volumes:
        - name: google-oauth-vol
          secret:
            secretName: google-oauth-secret
            optional: true
        - name: code-overrides
          configMap:
            name: ta-backend-code-overrides
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ta-rag
  labels:
    app: ta-backend
spec:
  type: LoadBalancer
  selector:
    app: ta-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
