apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta-backend
  namespace: ta-rag
  labels:
    app: ta-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ta-backend
  template:
    metadata:
      labels:
        app: ta-backend
    spec:
      containers:
        - name: backend
          image: ta-rag-backend:latest
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: QDRANT_URL
              value: "http://qdrant-service:6333"
            - name: GOOGLE_CREDENTIALS_FILE
              value: "/app/credentials.json"
            - name: GOOGLE_TOKEN_FILE
              value: "/app/token.json"
          envFrom:
            - configMapRef:
                name: ta-rag-config
            - secretRef:
                name: rag-env-secret
          volumeMounts:
            - name: google-oauth-vol
              mountPath: /app/credentials.json
              subPath: credentials.json
              readOnly: true
            - name: google-oauth-vol
              mountPath: /app/token.json
              subPath: token.json
          startupProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: google-oauth-vol
          secret:
            secretName: google-oauth-secret
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ta-rag
  labels:
    app: ta-backend
spec:
  type: LoadBalancer
  selector:
    app: ta-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
