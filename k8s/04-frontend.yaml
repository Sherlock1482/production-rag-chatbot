apiVersion: apps/v1
kind: Deployment
metadata:
  name: ta-frontend
  namespace: ta-rag
  labels:
    app: ta-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ta-frontend
  template:
    metadata:
      labels:
        app: ta-frontend
    spec:
      containers:
        - name: frontend
          image: ta-rag-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ta-rag
  labels:
    app: ta-frontend
spec:
  type: LoadBalancer
  selector:
    app: ta-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
