    \       if role == \"user\" or not role:\r\n            # Pattern: interview for/with
    <Name>\r\n            user_interview_match = re.search(\r\n                r\"(?i)\\b(?:interview\\s+for|interview\\s+with|for|with)\\s+([A-Za-z]+(?:\\s+[A-Za-z]+)?)\\b\",\r\n
