    Record: {row_text}\")\r\n\r\n    return extracted_chunks\r\n\r\n\r\ndef parse_ta_csv(file_obj):\r\n
    \   \"\"\"\r\n    Parse CSV directly from memory without saving it locally.\r\n
    \   Supports standard CSV headers, arbitrary candidate column names,\r\n    and
