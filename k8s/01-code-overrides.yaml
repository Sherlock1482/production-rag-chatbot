    \           index_ta_chunks(\r\n                extracted_chunks,\r\n                file.filename\r\n
    \           )\r\n\r\n            # ----------------------------------------------------\r\n
    \           # Store result\r\n            # ----------------------------------------------------\r\n\r\n
    \           results.append({\r\n                \"filename\": file.filename,\r\n
