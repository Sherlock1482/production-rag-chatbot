    Record clean MCP result in Langfuse\r\n                # -------------------------------------------------\r\n\r\n
    \               mcp_trace.update(\r\n                    output=mcp_data\r\n                )\r\n\r\n
    \               print(\r\n                    \"\\n========== CLEAN MCP DATA ==========\"\r\n
