    Document Upload\r\n# ============================================================\r\n\r\n@app.post(\"/upload\")\r\nasync
    def upload_documents(\r\n    files: List[UploadFile] = File(...)\r\n):\r\n\r\n
    \   upload_dir = Path(\"data/uploads\")\r\n\r\n    upload_dir.mkdir(\r\n        parents=True,\r\n
