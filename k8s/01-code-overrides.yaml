    interview lookup intent\r\n    interview_patterns = [\r\n        r\"\\bwhen\\b.*\\binterview\\b\",\r\n
    \       r\"\\bwhere\\b.*\\binterview\\b\",\r\n        r\"\\bwho\\b.*\\binterview\\b\",\r\n
    \       r\"\\binterview\\b.*\\bstatus\\b\",\r\n        r\"\\binterview\\b.*\\bstage\\b\",\r\n
