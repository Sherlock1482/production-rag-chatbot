    \       pass\r\n    return False\r\n\r\n\r\ndef contextualize_query(query: str,
    history: Optional[List[Dict[str, Any]]]) -> str:\r\n    \"\"\"\r\n    Contextualize
    the user's query by resolving coreferences like 'above candidate',\r\n    'him',
