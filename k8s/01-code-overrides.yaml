    \   )\r\n\r\n    return {\r\n        \"filename\": file.filename,\r\n        \"status\":
    \"analyzed\",\r\n        \"candidate_name\": clean_candidate_name,\r\n        \"fit_report\":
    fit_report.model_dump(),\r\n        \"markdown_report\": formatted_markdown,\r\n
    \       \"sources\": unique_sources,\r\n    }\r\n\r\n\r\n\r\n# ============================================================\r\n#
    Streaming Generator\r\n# ============================================================\r\n\r\ndef
    is_cyclic_repetition(text: str, min_unit_len: int = 10, max_unit_len: int = 80,
    min_repeats: int = 3) -> bool:\r\n    \"\"\"\r\n    Detect if the trailing part
    of text contains a cyclic repetition loop.\r\n    For example: \"CI/CD Tools,
    CI/CD Pipelines, CI/CD Tools, CI/CD Pipelines...\"\r\n    or \"AWS Certified Developer
    Professional, AWS Certified SysOps Administrator Professional...\"\r\n    \"\"\"\r\n
    \   clean_text = text.strip()\r\n    if len(clean_text) < min_unit_len * min_repeats:\r\n
    \       return False\r\n\r\n    # Check the last 400 characters for repeating
    substring patterns\r\n    tail = clean_text[-400:] if len(clean_text) > 400 else
    clean_text\r\n\r\n    for unit_len in range(min_unit_len, min(max_unit_len, len(tail)
    // min_repeats) + 1):\r\n        unit = tail[-unit_len:]\r\n        count = 0\r\n
    \       pos = len(tail)\r\n        while pos >= unit_len and tail[pos - unit_len:pos]
    == unit:\r\n            count += 1\r\n            pos -= unit_len\r\n        if
    count >= min_repeats:\r\n            return True\r\n\r\n    # Check repeating
    word phrases (e.g., repeated phrases of 2 to 8 words)\r\n    words = clean_text.split()\r\n
