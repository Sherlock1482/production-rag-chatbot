    ============================================================\r\n# Streaming Generator\r\n#
    ============================================================\r\n\r\nasync def
    generate_stream(rag_chain, user_prompt, request_query, relevant_docs, mcp_context,
    session_id=\"default\"):\r\n    full_response = \"\"\r\n\r\n    try:\r\n        async
    for chunk in rag_chain.astream({\r\n            \"user_prompt\": user_prompt\r\n
    \       }):\r\n            if chunk:\r\n                full_response += chunk\r\n
    \               yield chunk\r\n\r\n        # Run output guardrail after the complete
    response is generated\r\n        if not check_output_guardrail(\r\n            full_response,\r\n
    \           relevant_docs,\r\n            mcp_context\r\n        ):\r\n            print(\"WARNING:
    Output guardrail blocked the response.\")\r\n\r\n        citation_lines = [\"\",
    \"Sources used\"]\r\n        extracted_sources = []\r\n\r\n        if mcp_context:\r\n\r\n
    \           citation_lines.append(\r\n                \"[Live] Google Calendar
    via MCP\"\r\n            )\r\n            extracted_sources.append(\"[Live] Google
    Calendar via MCP\")\r\n\r\n        else:\r\n\r\n            seen_sources = set()\r\n\r\n
    \           for doc in relevant_docs:\r\n\r\n                source_name = doc.get(\"source\")
    or \"Unknown source\"\r\n                source_key = source_name.strip().casefold()\r\n\r\n
    \               if source_key in seen_sources:\r\n                    continue\r\n\r\n
    \               seen_sources.add(source_key)\r\n\r\n                citation_lines.append(\r\n
    \                   f\"[{len(seen_sources)}] {source_name}\"\r\n                )\r\n
    \               extracted_sources.append(source_name)\r\n\r\n        if len(citation_lines)
    > 1:\r\n            yield \"\\n\".join(citation_lines) + \"\\n\"\r\n\r\n        #
    Save to local JSON history\r\n        save_chat_to_json(\r\n            query=request_query,\r\n
    \           response=full_response,\r\n            sources=extracted_sources,\r\n
