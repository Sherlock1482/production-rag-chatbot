  datetime_extractor.py: "import re\r\nfrom datetime import datetime\r\n\r\n\r\ndef
    extract_datetime_details(query: str):\r\n    \"\"\"\r\n    Extract basic date,
    time, duration, and timezone information\r\n    from a scheduling query.\r\n\r\n
    \   This step only extracts information.\r\n    It does not validate or schedule
    anything yet.\r\n    \"\"\"\r\n\r\n    result = {\r\n        \"date\": None,\r\n
    \       \"time\": None,\r\n        \"duration_minutes\": None,\r\n        \"timezone\":
    None,\r\n    }\r\n\r\n    query_normalized = query.casefold()\r\n\r\n    # -------------------------\r\n
    \   # Time\r\n    # -------------------------\r\n    time_patterns = [\r\n        r\"\\b\\d{1,2}:\\d{2}\\s*(?:am|pm)\\b\",\r\n
    \       r\"\\b\\d{1,2}\\s*(?:am|pm)\\b\",\r\n    ]\r\n\r\n    for pattern in time_patterns:\r\n
    \       match = re.search(pattern, query_normalized)\r\n        if match:\r\n
    \           result[\"time\"] = match.group(0).replace(\" \", \"\")\r\n            break\r\n\r\n
    \   # -------------------------\r\n    # Duration\r\n    # -------------------------\r\n
    \   duration_match = re.search(\r\n        r\"\\b(\\d+)\\s*(minutes?|mins?|hours?|hrs?)\\b\",\r\n
    \       query_normalized,\r\n    )\r\n\r\n    if duration_match:\r\n        value
