    = pd.read_csv(file_obj, header=None)\r\n    except Exception as e:\r\n        raise
    ValueError(f\"Could not read CSV file: {e}\")\r\n\r\n    if raw_df.empty:\r\n
    \       return []\r\n\r\n    header_row = detect_header_row(raw_df)\r\n\r\n    file_obj.seek(0)\r\n
    \   try:\r\n        df = pd.read_csv(file_obj, header=header_row)\r\n    except
    Exception:\r\n        file_obj.seek(0)\r\n        df = pd.read_csv(file_obj, header=0)\r\n\r\n
    \   extracted_chunks = extract_tabular_chunks(df)\r\n    print(f\"Successfully
    extracted {len(extracted_chunks)} CSV chunks.\")\r\n    return extracted_chunks\r\n\r\nimport
    re\r\n\r\n##extract candidate name and email from resume text\r\nimport re\r\n\r\n\r\ndef
    extract_candidate_metadata(text: str):\r\n    \"\"\"\r\n    Extract candidate
    name and email from resume text.\r\n    \"\"\"\r\n\r\n    candidate_name = \"\"\r\n
    \   email = \"\"\r\n\r\n    # Extract email if the resume contains one\r\n    email_match
    = re.search(\r\n        r\"\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b\",\r\n
    \       text\r\n    )\r\n    if email_match:\r\n        email = email_match.group(0).strip()\r\n\r\n
    \   # Extract candidate name from:\r\n    # 1. Explicit label (Name: ... or Candidate
    Name: ...)\r\n    name_match = re.search(\r\n        r\"(?im)^(?:candidate\\s+name|name)\\s*[:\\-]\\s*(.+)$\",\r\n
    \       text\r\n    )\r\n    if name_match:\r\n        candidate_name = name_match.group(1).strip()\r\n
    \   else:\r\n        # 2. Fallback: First prominent line containing a 2-4 word
    full name\r\n        for line in text.splitlines():\r\n            clean = line.strip()\r\n
    \           if not clean or \"@\" in clean or \"http\" in clean.lower():\r\n                continue\r\n
    \           if any(kw in clean.lower() for kw in [\"resume\", \"curriculum\",
    \"cv\", \"profile\", \"contact\", \"summary\"]):\r\n                continue\r\n
    \           words = clean.split()\r\n            if 2 <= len(words) <= 4 and all(w.replace(\".\",
    \"\").isalpha() for w in words):\r\n                candidate_name = clean\r\n
    \               break\r\n\r\n    return {\r\n        \"candidate_name\": candidate_name,\r\n
    \       \"email\": email\r\n    }\r\n\r\n\r\ndef parse_ta_document(file_path:
    str):\r\n    \"\"\"\r\n    Parses Talent Acquisition documents\r\n    (Resumes,
    JDs, Spreadsheets)\r\n    using Unstructured and Pandas based on file extensions.\r\n
    \   \"\"\"\r\n\r\n    if not os.path.exists(file_path):\r\n        raise FileNotFoundError(\r\n
    \           f\"TA Document not found: {file_path}\"\r\n        )\r\n\r\n    file_ext
    = os.path.splitext(file_path)[1].lower()\r\n\r\n    print(\r\n        f\"Processing
    TA file [{file_ext}]: {file_path}...\"\r\n    )\r\n\r\n    extracted_chunks =
    []\r\n\r\n    # =====================================================\r\n    #
    CSV FILES\r\n    # =====================================================\r\n\r\n
    \   if file_ext == \".csv\":\r\n        raw_df = pd.read_csv(file_path, header=None)\r\n
    \       header_row = detect_header_row(raw_df)\r\n        try:\r\n            df
    = pd.read_csv(file_path, header=header_row)\r\n        except Exception:\r\n            df
    = pd.read_csv(file_path, header=0)\r\n\r\n        extracted_chunks.extend(extract_tabular_chunks(df))\r\n\r\n
    \   # =====================================================\r\n    # EXCEL FILES\r\n
    \   # =====================================================\r\n\r\n    elif file_ext
    in [\".xlsx\", \".xls\"]:\r\n        raw_df = pd.read_excel(file_path, header=None)\r\n
    \       header_row = detect_header_row(raw_df)\r\n        try:\r\n            df
    = pd.read_excel(file_path, header=header_row)\r\n        except Exception:\r\n
    \           df = pd.read_excel(file_path, header=0)\r\n\r\n        extracted_chunks.extend(extract_tabular_chunks(df))\r\n\r\n
    \   # =====================================================\r\n    # PDF / DOCX
    / TXT / OTHER DOCUMENTS\r\n    # =====================================================\r\n\r\n
    \   else:\r\n\r\n        elements = partition(\r\n            filename=file_path\r\n
    \       )\r\n\r\n        text_blocks = [\r\n            str(el).strip()\r\n            for
    el in elements\r\n            if str(el).strip()\r\n        ]\r\n\r\n        #
    Combine small Unstructured elements\r\n        # into larger chunks\r\n        current_chunk
    = \"\"\r\n\r\n        for block in text_blocks:\r\n\r\n            if len(current_chunk)
    + len(block) <= 1000:\r\n\r\n                current_chunk += block + \"\\n\"\r\n\r\n
    \           else:\r\n\r\n                extracted_chunks.append(\r\n                    current_chunk.strip()\r\n
    \               )\r\n\r\n                current_chunk = block + \"\\n\"\r\n        #for
    final chunk\r\n        if current_chunk.strip():\r\n\r\n            extracted_chunks.append(\r\n
    \               current_chunk.strip()\r\n            )\r\n\r\n    print(\r\n        f\"Successfully
    extracted \"\r\n        f\"{len(extracted_chunks)} text blocks/chunks.\"\r\n    )\r\n\r\n
    \   return extracted_chunks\r\n\r\n\r\nif __name__ == \"__main__\":\r\n\r\n    print(\r\n
    \       \"TA Document Parser module loaded successfully.\"\r\n    )\r\n"
  schedule_details.py: "from typing import Any, Dict, List, Optional\r\nfrom utils.datetime_extractor
    import extract_datetime_details\r\n\r\n\r\nDEFAULT_DURATION_MINUTES = 60\r\n\r\n\r\ndef
    get_missing_schedule_details(query: str, chat_history: Optional[List[Dict[str,
    Any]]] = None):\r\n    \"\"\"\r\n    Extract scheduling details and determine
    what information is missing.\r\n    Optionally inherits date, time, or duration
    from recent chat_history turns.\r\n    \"\"\"\r\n\r\n    details = extract_datetime_details(query)\r\n\r\n
    \   # If date is missing and history exists, check if date can be inferred from
    recent turns\r\n    if not details[\"date\"] and chat_history:\r\n        for
    msg in reversed(chat_history):\r\n            content = msg.get(\"content\") or
    msg.get(\"query\", \"\")\r\n            hist_details = extract_datetime_details(content)\r\n
    \           if hist_details.get(\"date\"):\r\n                details[\"date\"]
    = hist_details[\"date\"]\r\n                break\r\n\r\n    # If time is missing
    and history exists, check if time can be inferred\r\n    if not details[\"time\"]
    and chat_history:\r\n        for msg in reversed(chat_history):\r\n            content
    = msg.get(\"content\") or msg.get(\"query\", \"\")\r\n            hist_details
    = extract_datetime_details(content)\r\n            if hist_details.get(\"time\"):\r\n
    \               details[\"time\"] = hist_details[\"time\"]\r\n                break\r\n\r\n
    \   missing = []\r\n\r\n    if not details[\"date\"]:\r\n        missing.append(\"date\")\r\n\r\n
    \   if not details[\"time\"]:\r\n        missing.append(\"time\")\r\n\r\n    #
    Inherit duration from recent turn if available, else default to 60 minutes\r\n
    \   if not details[\"duration_minutes\"]:\r\n        inherited_duration = None\r\n
    \       if chat_history:\r\n            for msg in reversed(chat_history):\r\n
    \               content = msg.get(\"content\") or msg.get(\"query\", \"\")\r\n
    \               hist_details = extract_datetime_details(content)\r\n                if
    hist_details.get(\"duration_minutes\"):\r\n                    inherited_duration
    = hist_details[\"duration_minutes\"]\r\n                    break\r\n        details[\"duration_minutes\"]
    = inherited_duration or DEFAULT_DURATION_MINUTES\r\n\r\n    return {\r\n        \"details\":
    details,\r\n        \"missing\": missing,\r\n        \"complete\": len(missing)
    == 0,\r\n    }\r\n"
  scheduling_request.py: "import re\r\nfrom typing import Any, Dict, List, Optional\r\n\r\nfrom
    utils.intent_detector import detect_intent\r\nfrom utils.candidate_resolver import
    resolve_candidate\r\nfrom utils.context_manager import (\r\n    extract_candidate_from_history,\r\n
    \   is_candidate_context_reference,\r\n    is_valid_candidate_name,\r\n)\r\n\r\n\r\ndef
    extract_candidate_name(query: str, chat_history: Optional[List[Dict[str, Any]]]
    = None) -> str:\r\n    \"\"\"\r\n    Extract the candidate name from a scheduling
    request.\r\n    Supports multi-turn context resolution via chat_history.\r\n    \"\"\"\r\n
    \   # 1. If query contains context coreferences (e.g. 'above candidate', 'him',
    'her'),\r\n    # resolve the candidate from recent conversation history.\r\n    if
    is_candidate_context_reference(query) and chat_history:\r\n        candidate_from_context
    = extract_candidate_from_history(chat_history)\r\n        if candidate_from_context
    and is_valid_candidate_name(candidate_from_context):\r\n            return candidate_from_context\r\n\r\n
    \   candidate_query = query.casefold()\r\n\r\n    # Remove conversational filler
    phrases\r\n    candidate_query = re.sub(\r\n        r\"\\b(one\\s+more\\s+interview|one\\s+more|another\\s+interview|another|\"\r\n
    \       r\"today\\s+itself|itself|again|also|as\\s+well|instead|either|too)\\b\",\r\n
    \       \" \",\r\n        candidate_query,\r\n    )\r\n\r\n    # Remove context
    reference phrases so they aren't parsed as names\r\n    candidate_query = re.sub(\r\n
    \       r\"\\b(?:the\\s+)?above\\s+candidate\\b|\\bcandidate\\s+above\\b|\"\r\n
    \       r\"\\b(?:the\\s+)?previous\\s+candidate\\b|\\b(?:the\\s+)?same\\s+candidate\\b|\"\r\n
    \       r\"\\b(?:this|that|the)\\s+candidate\\b|\\bcandidate\\b|\"\r\n        r\"\\b(?:him|her|them)\\b\",\r\n
    \       \" \",\r\n        candidate_query,\r\n    )\r\n\r\n    # Remove common
    scheduling words.\r\n    candidate_query = re.sub(\r\n        r\"\\b(schedule|reschedule|book|rebook|set|up|arrange|an|the|a|interview|\"\r\n
    \       r\"interviews|meeting|call|session|slot|for|with|at|on|between|please|\"\r\n
    \       r\"kindly|me|can|could|would|you)\\b\",\r\n        \" \",\r\n        candidate_query,\r\n
    \   )\r\n\r\n    # Remove relative date expressions (including typos like tommorow,
    tommrow).\r\n    candidate_query = re.sub(\r\n        r\"\\b(today|day\\s+after\\s+tom+o*r+o*w?|tom+o*r+o*w?)\\b\",\r\n
    \       \" \",\r\n        candidate_query,\r\n    )\r\n\r\n    # Remove explicit
    dates such as:\r\n    # 2026-10-02\r\n    # 10/02/2026\r\n    candidate_query
    = re.sub(\r\n        r\"\\b\\d{4}-\\d{1,2}-\\d{1,2}\\b\",\r\n        \" \",\r\n
    \       candidate_query,\r\n    )\r\n\r\n    candidate_query = re.sub(\r\n        r\"\\b\\d{1,2}/\\d{1,2}/\\d{4}\\b\",\r\n
    \       \" \",\r\n        candidate_query,\r\n    )\r\n\r\n    # Remove month-based
    dates (both Month Day like October 7th and Day Month like 7th October).\r\n    month_regex
    = (\r\n        r\"(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|\"\r\n        r\"may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|\"\r\n
    \       r\"oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\"\r\n    )\r\n    candidate_query
    = re.sub(\r\n        r\"\\b\\d{1,2}(?:st|nd|rd|th)?(?:\\s+of)?\\s+\" + month_regex
    + r\"(?:,?\\s*\\d{4})?\\b\",\r\n        \" \",\r\n        candidate_query,\r\n
    \   )\r\n    candidate_query = re.sub(\r\n        r\"\\b\" + month_regex + r\"\\s+\\d{1,2}(?:st|nd|rd|th)?(?:,?\\s*\\d{4})?\\b\",\r\n
    \       \" \",\r\n        candidate_query,\r\n    )\r\n\r\n    # Remove time such
    as:\r\n    # 8:30 PM\r\n    # 8 PM\r\n    candidate_query = re.sub(\r\n        r\"\\b\\d{1,2}:\\d{2}\\s*(?:am|pm)\\b\",\r\n
    \       \" \",\r\n        candidate_query,\r\n    )\r\n\r\n    candidate_query
    = re.sub(\r\n        r\"\\b\\d{1,2}\\s*(?:am|pm)\\b\",\r\n        \" \",\r\n        candidate_query,\r\n
    \   )\r\n\r\n    # Remove duration such as:\r\n    # 30 minutes\r\n    # 1 hour\r\n
    \   candidate_query = re.sub(\r\n        r\"\\b\\d+\\s*(?:minutes?|mins?|hours?|hrs?)\\b\",\r\n
    \       \" \",\r\n        candidate_query,\r\n    )\r\n\r\n    # Remove timezone.\r\n
    \   candidate_query = re.sub(\r\n        r\"\\b(?:UTC(?:[+-]\\d{1,2}(?::\\d{2})?)?|IST|EST|PST|CST|MST)\\b\",\r\n
    \       \" \",\r\n        candidate_query,\r\n        flags=re.IGNORECASE,\r\n
    \   )\r\n\r\n    # Remove possessive \"'s\".\r\n    candidate_query = re.sub(\r\n
    \       r\"'s\\b\",\r\n        \"\",\r\n        candidate_query,\r\n    )\r\n\r\n
    \   # Keep only letters/numbers/spaces.\r\n    candidate_query = re.sub(\r\n        r\"[^a-z0-9\\s]\",\r\n
    \       \" \",\r\n        candidate_query,\r\n    )\r\n\r\n    cleaned_name =
    \" \".join(candidate_query.split())\r\n\r\n    # If a valid candidate name was
    extracted, return it\r\n    if is_valid_candidate_name(cleaned_name):\r\n        return
    cleaned_name\r\n\r\n    # If no valid name was extracted, fallback to conversation
    history if available\r\n    if chat_history:\r\n        candidate_from_context
    = extract_candidate_from_history(chat_history)\r\n        if candidate_from_context
    and is_valid_candidate_name(candidate_from_context):\r\n            return candidate_from_context\r\n\r\n
    \   return \"\"\r\n\r\n\r\ndef analyze_scheduling_request(query: str, chat_history:
    Optional[List[Dict[str, Any]]] = None):\r\n    \"\"\"\r\n    Detect intent and
    resolve the candidate for scheduling requests.\r\n    Supports multi-turn context
    resolution via chat_history.\r\n    \"\"\"\r\n\r\n    intent = detect_intent(query)\r\n\r\n
    \   if intent != \"schedule_interview\":\r\n        return {\r\n            \"intent\":
    intent,\r\n            \"candidate\": None,\r\n        }\r\n\r\n    candidate_name
    = extract_candidate_name(query, chat_history=chat_history)\r\n\r\n    if not candidate_name
    or not is_valid_candidate_name(candidate_name):\r\n        return {\r\n            \"intent\":
    intent,\r\n            \"candidate\": None,\r\n            \"error\": \"Candidate
    name not provided. Which candidate would you like to schedule an interview for?\",\r\n
    \       }\r\n\r\n    candidate = resolve_candidate(candidate_name)\r\n\r\n    if
    not candidate:\r\n        # Candidate not indexed in resumes/vector DB, but a
    valid candidate name was provided/resolved\r\n        return {\r\n            \"intent\":
    intent,\r\n            \"candidate\": {\r\n                \"candidate_name\":
    candidate_name.title(),\r\n                \"email\": \"\",\r\n            },\r\n
    \           \"candidate_query\": candidate_name,\r\n        }\r\n\r\n    return
    {\r\n        \"intent\": intent,\r\n        \"candidate\": candidate,\r\n    }"
