  parser.py: "import os\r\nimport pandas as pd\r\nfrom unstructured.partition.auto
    import partition\r\nimport sys\r\nfrom pathlib import Path\r\n\r\nsys.path.append(\r\n
    \   str(Path(__file__).resolve().parents[1])\r\n)\r\n\r\ndef detect_header_row(raw_df:
    pd.DataFrame) -> int:\r\n    \"\"\"\r\n    Finds the actual table header row in
    a dataframe.\r\n    Looks for candidate/recruitment related keywords in the first
    15 rows.\r\n    Defaults to 0 (top row) if no preamble/title row is detected.\r\n
    \   \"\"\"\r\n    header_keywords = {\r\n        \"candidate\", \"candidate_name\",
    \"candidate_id\", \"full_name\", \r\n        \"name\", \"applicant\", \"job_title\",
    \"role\", \"email\", \r\n        \"skills\", \"technical_skills\", \"experience\",
    \"resume\"\r\n    }\r\n\r\n    for index, row in raw_df.head(15).iterrows():\r\n
    \       row_values = [\r\n            str(v).strip().lower()\r\n            for
    v in row.tolist()\r\n            if pd.notna(v)\r\n        ]\r\n        if any(any(kw
    in val for kw in header_keywords) for val in row_values):\r\n            return
    index\r\n\r\n    return 0\r\n\r\n\r\ndef extract_tabular_chunks(df: pd.DataFrame)
    -> list:\r\n    \"\"\"\r\n    Converts dataframe rows into structured text chunks
    for RAG embedding.\r\n    Intelligently handles various candidate/name column
    names and filters empty/summary rows.\r\n    \"\"\"\r\n    df.columns = [str(c).strip()
    for c in df.columns]\r\n\r\n    candidate_col = None\r\n    for col in df.columns:\r\n
    \       clean = col.lower().replace(\"_\", \" \").strip()\r\n        if clean
    in [\"candidate\", \"candidate name\", \"full name\", \"fullname\", \"name\",
    \"applicant\"]:\r\n            candidate_col = col\r\n            break\r\n\r\n
    \   extracted_chunks = []\r\n    for _, row in df.iterrows():\r\n        if row.dropna().empty:\r\n
    \           continue\r\n\r\n        if candidate_col and pd.notna(row.get(candidate_col)):\r\n
    \           cand_str = str(row.get(candidate_col)).strip()\r\n            if not
    cand_str or cand_str.lower().startswith((\"average\", \"total\", \"summary\",
    \"count\")):\r\n                continue\r\n\r\n        row_parts = []\r\n        for
    col, val in row.items():\r\n            if pd.notna(val) and str(val).strip()
