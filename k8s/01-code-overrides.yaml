    Index OCR text into Qdrant\r\n                # ------------------------------------------------\r\n\r\n
    \               index_ta_chunks(\r\n                    [extracted_text],\r\n
    \                   file.filename\r\n                )\r\n\r\n                results.append({\r\n
    \                   \"filename\": file.filename,\r\n                    \"type\":
    \"image\",\r\n                    \"status\": \"success\",\r\n                    \"message\":
    (\r\n                        \"Image OCR completed and indexed successfully.\"\r\n
