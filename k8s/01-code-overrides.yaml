    \   if CHAT_HISTORY_FILE.exists():\r\n        try:\r\n            with open(CHAT_HISTORY_FILE,
    \"r\", encoding=\"utf-8\") as f:\r\n                content = f.read().strip()\r\n
    \               if content:\r\n                    chats = json.loads(content)\r\n
    \                   if isinstance(chats, list):\r\n                        target_session
    = session_id or \"default\"\r\n                        session_chats = [\r\n                            c
    for c in chats\r\n                            if c.get(\"session_id\") == target_session\r\n
    \                       ]\r\n                        history = []\r\n                        for
    c in session_chats[-limit:]:\r\n                            if c.get(\"query\"):\r\n
    \                               history.append({\"role\": \"user\", \"content\":
    c[\"query\"]})\r\n                            if c.get(\"response\"):\r\n                                history.append({\"role\":
    \"assistant\", \"content\": c[\"response\"]})\r\n                        return
    history\r\n        except Exception as e:\r\n            print(f\"Warning: Could
    not read session history: {e}\")\r\n    return []\r\n\r\n\r\n# ============================================================\r\n#
