    as f:\r\n                    content = f.read().strip()\r\n                    if
    content:\r\n                        chats = json.loads(content)\r\n                        if
    not isinstance(chats, list):\r\n                            chats = []\r\n            except
    Exception as read_err:\r\n                print(f\"Warning: Could not read existing
