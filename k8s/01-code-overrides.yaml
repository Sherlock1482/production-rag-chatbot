    \           # ----------------------------------------------------\r\n            #
    Save uploaded file\r\n            # ----------------------------------------------------\r\n\r\n
    \           file_path = upload_dir / file.filename\r\n            with open(file_path,
    \"wb\") as buffer:\r\n                shutil.copyfileobj(\r\n                    file.file,\r\n
    \                   buffer\r\n                )\r\n\r\n            # ----------------------------------------------------\r\n
    \           # Handle uploaded file\r\n            # ----------------------------------------------------\r\n\r\n
    \           image_extensions = {\r\n                \".png\",\r\n                \".jpg\",\r\n
