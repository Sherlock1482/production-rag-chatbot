    \                       count=1,\r\n                    )\r\n\r\n    # Clean double
    spaces\r\n    modified = \" \".join(modified.split())\r\n    return modified\r\n\r\n\r\ndef
    format_history_for_prompt(history: Optional[List[Dict[str, Any]]], max_turns:
    int = 5) -> str:\r\n    \"\"\"\r\n    Format recent conversation history as plain
    text for the LLM prompt.\r\n    \"\"\"\r\n    if not history:\r\n        return
