    \   )\r\n\r\n    return {\r\n        \"filename\": file.filename,\r\n        \"status\":
    \"analyzed\",\r\n        \"candidate_name\": clean_candidate_name,\r\n        \"fit_report\":
    fit_report.model_dump(),\r\n        \"markdown_report\": formatted_markdown,\r\n
    \       \"sources\": unique_sources,\r\n    }\r\n\r\n\r\n\r\n# ============================================================\r\n#
    Streaming Generator\r\n# ============================================================\r\n\r\ndef
    is_cyclic_repetition(text: str, min_unit_len: int = 10, max_unit_len: int = 80,
    min_repeats: int = 3) -> bool:\r\n    \"\"\"\r\n    Detect if the trailing part
    of text contains a cyclic repetition loop.\r\n    For example: \"CI/CD Tools,
    CI/CD Pipelines, CI/CD Tools, CI/CD Pipelines...\"\r\n    or \"AWS Certified Developer
    Professional, AWS Certified SysOps Administrator Professional...\"\r\n    \"\"\"\r\n
    \   clean_text = text.strip()\r\n    if len(clean_text) < min_unit_len * min_repeats:\r\n
    \       return False\r\n\r\n    # Check the last 400 characters for repeating
    substring patterns\r\n    tail = clean_text[-400:] if len(clean_text) > 400 else
    clean_text\r\n\r\n    for unit_len in range(min_unit_len, min(max_unit_len, len(tail)
    // min_repeats) + 1):\r\n        unit = tail[-unit_len:]\r\n        count = 0\r\n
    \       pos = len(tail)\r\n        while pos >= unit_len and tail[pos - unit_len:pos]
    == unit:\r\n            count += 1\r\n            pos -= unit_len\r\n        if
    count >= min_repeats:\r\n            return True\r\n\r\n    # Check repeating
    word phrases (e.g., repeated phrases of 2 to 8 words)\r\n    words = clean_text.split()\r\n
    \   if len(words) >= 12:\r\n        for phrase_len in range(2, 9):\r\n            if
    len(words) < phrase_len * min_repeats:\r\n                continue\r\n            phrase
    = words[-phrase_len:]\r\n            count = 0\r\n            idx = len(words)\r\n
    \           while idx >= phrase_len and words[idx - phrase_len:idx] == phrase:\r\n
    \               count += 1\r\n                idx -= phrase_len\r\n            if
    count >= min_repeats:\r\n                return True\r\n\r\n    return False\r\n\r\n\r\nasync
    def generate_stream(rag_chain, user_prompt, request_query, relevant_docs, mcp_context,
    session_id=\"default\"):\r\n    full_response = \"\"\r\n\r\n    try:\r\n        async
    for chunk in rag_chain.astream({\r\n            \"user_prompt\": user_prompt\r\n
    \       }):\r\n            if chunk:\r\n                full_response += chunk\r\n
    \               yield chunk\r\n                if is_cyclic_repetition(full_response):\r\n
    \                   print(\"WARNING: Cyclic repetition detected in LLM stream.
    Halting stream to prevent infinite loop.\")\r\n                    break\r\n\r\n
    \       # Run output guardrail after the complete response is generated\r\n        if
    not check_output_guardrail(\r\n            full_response,\r\n            relevant_docs,\r\n
    \           mcp_context\r\n        ):\r\n            print(\"WARNING: Output guardrail
    blocked the response.\")\r\n\r\n        citation_lines = [\"\", \"Sources used\"]\r\n
    \       extracted_sources = []\r\n\r\n        if mcp_context:\r\n\r\n            citation_lines.append(\r\n
    \               \"[Live] Google Calendar via MCP\"\r\n            )\r\n            extracted_sources.append(\"[Live]
    Google Calendar via MCP\")\r\n\r\n        else:\r\n\r\n            seen_sources
    = set()\r\n\r\n            for doc in relevant_docs:\r\n\r\n                source_name
    = doc.get(\"source\") or \"Unknown source\"\r\n                source_key = source_name.strip().casefold()\r\n\r\n
    \               if source_key in seen_sources:\r\n                    continue\r\n\r\n
    \               seen_sources.add(source_key)\r\n\r\n                citation_lines.append(\r\n
    \                   f\"[{len(seen_sources)}] {source_name}\"\r\n                )\r\n
    \               extracted_sources.append(source_name)\r\n\r\n        if len(citation_lines)
    > 1:\r\n            yield \"\\n\".join(citation_lines) + \"\\n\"\r\n\r\n        #
